<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Simulation - Admin Overview</title>
<style>
:root{--bg:#fdeeee;--panel:#ffffff;--panel2:#fff5f5;--line:#efc3c3;--text:#2a2224;--mute:#6f6165;--ok:#1b8a4b;--warn:#b26a00;--bad:#c62828;--info:#1565c0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffdcdc 0%,#ffffff 55%,#ffe6e6 100%) fixed;color:var(--text);font:14px/1.45 Verdana,Geneva,Tahoma,sans-serif}
h1,h2,h3{margin:0;font-weight:700;color:#a31919} h1{font-size:22px}
button{font:inherit;font-size:13px;color:var(--text);background:#fff;border:1px solid #dba3a3;border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--bad);background:#fff0f0} button.on{background:#c62828;border-color:#c62828;color:#fff} button.go{background:#1b8a4b;border-color:#1b8a4b;color:#fff}
input{font:inherit;color:var(--text);background:#fff;border:1px solid #dba3a3;border-radius:6px;padding:9px 12px}
.wrap{padding:12px 16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.top .sp{flex:1}
.clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 12px}
.mute{color:var(--mute)} .small{font-size:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid #c62828;border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px rgba(160,30,30,.08)}
.card.EMPTY{opacity:.5}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head .sp{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.04em}
.CLEAR{background:#dff3e7;color:var(--ok)} .UNCLEAR{background:#fdeccc;color:var(--warn)} .BUSY{background:#dceafb;color:var(--info)} .pill.EMPTY{background:#eee;color:var(--mute)}
.card h2{font-size:17px}.num{font-size:12.5px;white-space:nowrap}.num b{font-size:18px} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)} .c-info{color:var(--info)}
.badge{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:#c62828;color:#fff;margin-right:4px}
.badge.t{background:#5e35b1;color:#fff}
.strip{position:relative;height:120px;margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#cfe6fb 0%,#eef6fd 62%,#9cc29f 62%,#86b08a 100%)}
.rwy{position:absolute;left:3%;right:3%;top:74%;height:13%;background:#4a4f55;border-top:2px solid #fff;border-bottom:2px solid #fff}
.rwy:after{content:"";position:absolute;left:2%;right:2%;top:45%;border-top:2px dashed #fff}
.rwyno{position:absolute;left:3.5%;top:57%;font-weight:700;font-size:12px;color:#33413a}
.plane{position:absolute;width:64px;height:26px;margin:-22px 0 0 -32px;transition:left 1s linear,top 1s linear,opacity .6s;pointer-events:none}
.veh{position:absolute;top:70%;font-size:22px;transition:left 1s linear}
.boom{position:absolute;left:60%;top:60%;font-size:40px;margin:-22px 0 0 -20px;animation:boom .5s infinite alternate}
@keyframes boom{to{transform:scale(1.25)}}
.cap{position:absolute;right:8px;top:6px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.9);border:1px solid var(--line);padding:2px 8px;border-radius:5px}
.cap.l{right:auto;left:8px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.log div{padding:2px 0;border-bottom:1px solid #f6dede;font-size:13px}
table{border-collapse:collapse;width:100%}td,th{padding:3px 8px;text-align:left;border-bottom:1px solid #f6dede}th{color:var(--mute);font-weight:400;font-size:12px}
#login{max-width:440px;margin:15vh auto;text-align:center}
#hint{background:#fff8e1;border:1px solid #f0c36d;border-left:6px solid #f5a623;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-weight:700}
</style>
</head>
<body>
<div id="login" style="display:none" class="card"><h2>Admin overview</h2><p class="mute">Enter the admin key to control the simulation.</p>
  <input id="key" type="password" placeholder="admin key"> <button id="enter" class="go">Enter</button><p id="err" class="c-bad"></p></div>
<div class="wrap" id="main" style="display:none">
  <div class="top">
    <h1>Airport Runway Digital Twin <span class="mute" style="font-size:15px">· data quality and noise</span></h1><div class="sp"></div>
    <span id="status" class="pill BUSY"></span><span class="clock" id="clock"></span>
    <button id="bStart" class="go">Start</button><button id="bPause">Pause</button>
    <button id="bReveal" title="Show the real runway condition and active sensor faults">Reveal truth</button>
    <button id="bSound">Sound: on</button>
    <button id="bReset" title="Clears game outcomes, keeps registrations">Reset game</button>
    <button id="bWipe" title="Also removes all registrations">Clear registrations</button>
  </div>
  <div id="hint" style="display:none"></div>
  <div class="cards" id="cards"></div>
  <div class="bottom"><div class="card"><h3>Tower radio</h3><div class="log" id="radio"></div></div>
    <div class="card"><h3>Leaderboard</h3><div id="board"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=t=>Math.floor(t/60)+':'+String(Math.max(0,Math.floor(t%60))).padStart(2,'0');
let key=''; try{key=sessionStorage.getItem('rwy_admin')||''}catch(e){}
let reveal=false, sound=true, lastSeq=null, audio=null, busy=false, built='';
const PLANE=`<svg viewBox="0 0 64 26"><path d="M3 15 L10 3 L15 3 L16 12 L47 11 Q60 11 62 16 Q60 20 48 20 L12 20 Q4 20 3 15Z" fill="#c62828" stroke="#5c0f0f" stroke-width="1"/><path d="M26 16 L40 16 L30 24 L24 24Z" fill="#8e1b1b" stroke="#5c0f0f" stroke-width="1"/><rect x="50" y="13" width="6" height="2.5" rx="1" fill="#ffffff"/></svg>`;

// ---------- sound (synthesised in the browser, no audio files) ----------
let master=null, verb=null;
function ctx(){
  if(!audio){ try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    const comp=audio.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=5;
    master=audio.createGain(); master.gain.value=.9; master.connect(comp).connect(audio.destination);
    // small synthetic reverb so sounds have space instead of sounding like raw beeps
    const len=audio.sampleRate*1.8, ir=audio.createBuffer(2,len,audio.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    verb=audio.createConvolver(); verb.buffer=ir; const wet=audio.createGain(); wet.gain.value=.28; verb.connect(wet).connect(master);
  }catch(e){} }
  if(audio&&audio.state==='suspended')audio.resume(); return audio;
}
document.addEventListener('pointerdown',ctx);
function out(node){ node.connect(master); node.connect(verb); }
let brown=null;
function noiseBuf(a){ if(brown) return brown; const n=a.sampleRate*6; brown=a.createBuffer(1,n,a.sampleRate); const d=brown.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.04*w)/1.04; d[i]=last*3.2+w*.25; } return brown; }
// env: [[time, value], ...] relative to start
function envGain(a,t,env){ const g=a.createGain(); g.gain.setValueAtTime(.0001,t); for(const [dt,v] of env) g.gain.linearRampToValueAtTime(Math.max(.0001,v),t+dt); return g; }
function noise(when,dur,type,f0,f1,q,env){ const a=ctx(); if(!a||!sound)return; const t=a.currentTime+when, src=a.createBufferSource(), flt=a.createBiquadFilter();
  src.buffer=noiseBuf(a); src.loop=true; flt.type=type; flt.Q.value=q; flt.frequency.setValueAtTime(f0,t); flt.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=envGain(a,t,env); src.connect(flt).connect(g); out(g); src.start(t,Math.random()*3); src.stop(t+dur+.05); }
function osc(when,dur,type,f0,f1,env,lp){ const a=ctx(); if(!a||!sound)return; const t=a.currentTime+when, o=a.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=envGain(a,t,env);
  if(lp){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f).connect(g); } else o.connect(g);
  out(g); o.start(t); o.stop(t+dur+.05); }
function jet(when,dur,f0,f1,vol,shape){ // layered jet engine: low rumble + airflow hiss + two detuned turbine whines
  const e=shape==='in'?[[dur*.6,vol],[dur,.0001]]:shape==='out'?[[dur*.25,vol],[dur,.0001]]:[[dur*.4,vol],[dur*.7,vol*.8],[dur,.0001]];
  noise(when,dur,'lowpass',f0*.35,f1*.35,.7,e.map(([t,v])=>[t,v*1.3]));
  noise(when,dur,'bandpass',f0*2.2,f1*2.2,.9,e.map(([t,v])=>[t,v*.55]));
  osc(when,dur,'sawtooth',f0*1.9,f1*1.9,e.map(([t,v])=>[t,v*.045]),2600);
  osc(when,dur,'sawtooth',f0*1.93+3,f1*1.93+3,e.map(([t,v])=>[t,v*.04]),2600);
}
function bell(when,f,dur,vol){ osc(when,dur,'sine',f,f,[[.01,vol],[dur,.0001]]); osc(when,dur*.6,'sine',f*2.01,f*2.01,[[.01,vol*.35],[dur*.6,.0001]]); osc(when,dur*.3,'sine',f*3.02,f*3.02,[[.01,vol*.15],[dur*.3,.0001]]); }
const SND={
  land(){ jet(0,3.2,900,420,.5,'in');                                  // fly-in, engine winding down
    noise(2.6,.28,'bandpass',2800,1500,6,[[.02,.45],[.28,.0001]]);     // tyre chirp, main gear
    noise(2.95,.22,'bandpass',2500,1400,6,[[.02,.3],[.22,.0001]]);     // nose gear
    jet(3.1,3.2,380,300,.6,'mid'); },                                  // reverse thrust roar
  takeoff(){ jet(0,5.5,260,950,.65,'mid'); osc(0,5.5,'sine',55,75,[[1.5,.25],[4,.2],[5.5,.0001]]); },
  crash(){ osc(0,1.6,'sine',95,28,[[.01,.9],[1.6,.0001]]);              // impact thump
    noise(0,3.2,'lowpass',2600,90,.7,[[.02,1.1],[.5,.7],[3.2,.0001]]); // explosion
    for(let i=0;i<14;i++) noise(.3+Math.random()*2.2,.07,'bandpass',1500+Math.random()*3000,900,3,[[.005,.3],[.07,.0001]]); // debris
    for(let i=0;i<3;i++){ osc(2.6+i*1.0,.5,'sawtooth',620,880,[[.05,.07],[.45,.07],[.5,.0001]],1800); osc(3.1+i*1.0,.5,'sawtooth',880,620,[[.05,.07],[.45,.07],[.5,.0001]],1800); } }, // siren
  goaround(){ jet(0,4.2,380,1100,.65,'mid'); bell(.1,1320,.25,.12); bell(.4,1320,.25,.12); },
  work(){ noise(0,2.6,'lowpass',140,120,1,[[.3,.5],[2.2,.5],[2.6,.0001]]);  // diesel idle
    for(let i=0;i<4;i++) osc(.2+i*.55,.28,'square',1150,1150,[[.01,.06],[.26,.06],[.28,.0001]],2400); }, // reversing beeper
  workdone(){ bell(0,784,.5,.14); bell(.16,988,.5,.14); bell(.32,1175,.9,.14); },
  call(){ bell(0,880,.5,.16); bell(.22,1109,.5,.16); bell(.44,1319,.9,.16);        // tower chime
    noise(.9,.35,'bandpass',1800,1800,1.2,[[.02,.08],[.3,.08],[.35,.0001]]); },    // radio squelch
  mayday(){ for(let i=0;i<4;i++){ osc(i*.5,.25,'square',960,960,[[.01,.09],[.23,.09],[.25,.0001]],2600); osc(i*.5+.25,.25,'square',770,770,[[.01,.09],[.23,.09],[.25,.0001]],2600); } },
};

async function call(cmd){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'admin',key,cmd})});
  return r.json();
}
function planeState(r){ // -> {x,y,rot,op} in % of the strip
  const a=r.assigned, o=r.lastOp;
  if(a){ const p=Math.min(1,a.p);
    if(a.kind==='landing') return {x:2+p*56,y:10+p*64,rot:7,op:1};
    if(p<.55) return {x:8,y:74,rot:0,op:1};
    const q=(p-.55)/.45; return {x:8+q*q*46,y:74,rot:0,op:1}; }
  if(o&&o.age<8){ const q=o.age/7;
    if(o.outcome==='success'&&o.kind==='landing') return {x:58+Math.min(1,q)*34,y:74,rot:0,op:q>1?0:1};
    if(o.outcome==='success') return {x:54+q*50,y:74-q*70,rot:-14,op:q>1?0:1};
    if(o.outcome==='goaround'){ const p=o.p||0;
      if(o.kind==='takeoff') return {x:8,y:74,rot:0,op:q>.8?0:1};
      const x0=2+p*56,y0=10+p*64; return {x:x0+q*(104-x0),y:y0-q*(y0+12),rot:-14,op:q>1?0:1}; } }
  return null;
}
function build(d){ // create cards once per room set; then update in place so animations stay smooth
  const sig=d.rooms.map(r=>r.n).join(',');
  if(sig===built) return; built=sig;
  $('cards').innerHTML=d.rooms.map(r=>`<div class="card" id="c${r.n}">
    <div class="head"><h2>Runway ${r.n} Control Room</h2><span class="pill" id="st${r.n}"></span><span class="mute small" id="tm${r.n}"></span><span class="sp"></span>
      <span class="num">Score <b id="sc${r.n}">0</b></span><span class="num c-ok">Safe <b id="ok${r.n}">0</b></span>
      <span class="num c-bad">Unsuccessful <b id="cr${r.n}">0</b></span><span class="num c-warn">Go-arounds <b id="ga${r.n}">0</b></span></div>
    <div class="small" id="pb${r.n}" style="min-height:20px;margin-top:4px"></div>
    <div class="strip"><div class="rwy"></div><div class="rwyno">${String(r.n).padStart(2,'0')}</div>
      <div class="plane" id="pl${r.n}" style="opacity:0;left:2%;top:10%">${PLANE}</div>
      <div class="veh" id="vh${r.n}" style="display:none">🚜</div><div class="boom" id="bm${r.n}" style="display:none">💥</div>
      <div class="cap" id="cp${r.n}"></div><div class="cap l" id="cl${r.n}" style="display:none"></div></div></div>`).join('');
}
function render(d){
  $('status').textContent=d.status.toUpperCase(); $('status').className='pill '+({running:'CLEAR',paused:'UNCLEAR',ended:'UNCLEAR',lobby:'BUSY'})[d.status];
  $('clock').textContent=mmss(d.left);
  $('bStart').textContent=d.status==='paused'?'Resume':'Start'; $('bStart').style.display=d.status==='running'||d.status==='ended'?'none':'';
  $('hint').style.display=d.status==='lobby'||d.status==='paused'?'block':'none';
  $('hint').textContent=d.status==='lobby'?d.participants+' participants registered. The simulation has NOT started: press the green Start button. The first aircraft calls 30 seconds later.':'Paused. Press Resume to continue.';
  build(d);
  for(const r of d.rooms){
    const n=r.n; $('c'+n).className='card '+(r.status==='EMPTY'?'EMPTY':'');
    $('st'+n).textContent=r.status; $('st'+n).className='pill '+r.status;
    $('tm'+n).textContent=r.team+'/6 in room';
    $('sc'+n).textContent=r.score; $('ok'+n).textContent=r.stats.success; $('cr'+n).textContent=r.stats.crash; $('ga'+n).textContent=r.stats.goRight+r.stats.goWrong;
    let pb=r.status==='EMPTY'?'<span class="mute">No team registered.</span>':r.problems.length?'Sensors report: '+r.problems.map(p=>`<span class="badge">${esc(p)}</span>`).join(''):'<span class="mute">Sensors report no problem.</span>';
    if(r.job) pb+=` <span class="c-warn">${esc(r.job.label)} · ${r.job.left}s</span>`;
    if(r.wreck) pb+=` <span class="c-bad">Wreck removal · ${r.wreck}s</span>`;
    if((reveal||d.status==='ended')&&r.status!=='EMPTY') pb+=`<br><span class="mute">Reality (${esc(r.wx)}):</span> `+(r.truth.length?r.truth.map(p=>`<span class="badge t">${esc(p)}</span>`).join(''):'<span class="c-ok">runway safe</span>')
      +(r.faults.length?` <span class="mute">· faulty sensors:</span> `+r.faults.map(esc).join('; '):'')+(r.dq!=null?` <span class="mute">· sensor picture correct ${r.dq}% of the time</span>`:'');
    $('pb'+n).innerHTML=pb;
    const ps=planeState(r), pl=$('pl'+n);
    if(ps){ if(pl.style.opacity==='0'&&ps.op){ pl.style.transition='none'; pl.style.left=ps.x+'%'; pl.style.top=ps.y+'%'; pl.offsetWidth; pl.style.transition=''; }
      pl.style.left=ps.x+'%'; pl.style.top=ps.y+'%'; pl.style.transform='rotate('+ps.rot+'deg)'; pl.style.opacity=ps.op; }
    else pl.style.opacity=0;
    $('bm'+n).style.display=(r.wreck||(r.lastOp&&r.lastOp.outcome==='crash'&&r.lastOp.age<6))?'block':'none';
    const vh=$('vh'+n); vh.style.display=r.job?'block':'none'; if(r.job) vh.style.left=(20+((d.t*7)%60))+'%';
    const a=r.assigned, o=r.lastOp;
    $('cp'+n).textContent=a?(a.emergency?'MAYDAY ':'')+a.cs+(a.kind==='landing'?' landing in ':' take-off in ')+Math.max(0,a.left)+' s'
      :o&&o.age<10?o.cs+': '+({success:o.kind==='landing'?'landed safely':'departed safely',crash:'ACCIDENT',goaround:o.kind==='landing'?'GO-AROUND':'take-off aborted'})[o.outcome]:'';
    $('cp'+n).style.display=$('cp'+n).textContent?'block':'none';
  }
  $('radio').innerHTML=d.radio.slice().reverse().map(l=>`<div class="c-${l.c}"><span class="mute">${l.t}</span> ${esc(l.m)}</div>`).join('')||'<div class="mute">'+d.participants+' participants registered. Press Start when the rooms are ready.</div>';
  const rows=d.rooms.filter(r=>r.team).sort((a,b)=>b.score-a.score);
  $('board').innerHTML=`<table><tr><th>#</th><th>Room</th><th>Score</th><th>Safe</th><th>Accidents</th><th>Correct aborts</th><th>Wrong aborts</th><th>Wrong declines</th>${d.status==='ended'||reveal?'<th>Data picture correct</th>':''}</tr>`+
    rows.map((r,i)=>`<tr><td>${i+1}</td><td>Runway ${r.n}</td><td><b>${r.score}</b></td><td>${r.stats.success}</td><td>${r.stats.crash}</td><td>${r.stats.goRight}</td><td>${r.stats.goWrong}</td><td>${r.stats.declWrong}</td>${d.status==='ended'||reveal?`<td>${r.dq==null?'-':r.dq+'%'}</td>`:''}</tr>`).join('')+'</table>';
  if(lastSeq!==null) for(const e of d.events) if(e.seq>lastSeq&&SND[e.type]) SND[e.type]();
  lastSeq=d.evSeq;
}
async function tick(cmd){
  if(busy&&!cmd) return; busy=true;
  try{ const d=await call(cmd);
    if(d.error==='bad-key'){ $('main').style.display='none'; $('login').style.display='block'; if(key)$('err').textContent='Wrong key.'; key=''; }
    else if(!d.error){ $('login').style.display='none'; $('main').style.display='block'; try{sessionStorage.setItem('rwy_admin',key)}catch(e){} render(d); }
  }catch(e){} busy=false;
}
$('enter').onclick=()=>{key=$('key').value;tick()}; $('key').onkeydown=e=>{if(e.key==='Enter')$('enter').onclick()};
$('bStart').onclick=()=>tick('start'); $('bPause').onclick=()=>tick('pause');
$('bReset').onclick=()=>{if(confirm('Reset the game? Scores and outcomes are cleared; registrations are kept.')){lastSeq=null;tick('reset')}};
$('bWipe').onclick=()=>{if(confirm('Remove ALL registrations and reset everything?')){lastSeq=null;built='';tick('wipe')}};
$('bReveal').onclick=()=>{reveal=!reveal;$('bReveal').className=reveal?'on':'';};
$('bSound').onclick=()=>{sound=!sound;$('bSound').textContent='Sound: '+(sound?'on':'off')};
tick(); setInterval(()=>{ if(key) tick() },1000);
</script>
</body>
</html>
