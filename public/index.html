<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Control Room</title>
<style>
:root{--bg:#fdeeee;--panel:#ffffff;--panel2:#fff5f5;--line:#efc3c3;--text:#2a2224;--mute:#6f6165;--ok:#1b8a4b;--warn:#b26a00;--bad:#c62828;--info:#1565c0;--acc:#c62828}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffdcdc 0%,#ffffff 55%,#ffe6e6 100%) fixed;color:var(--text);font:13.5px/1.45 Verdana,Geneva,Tahoma,sans-serif}
h1,h2,h3{margin:0;font-weight:700;color:#a31919} h3{font-size:14.5px}
button{font:inherit;font-size:12.5px;color:var(--text);background:#fff;border:1px solid #dba3a3;border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);background:#fff0f0}
button:disabled{opacity:.38;cursor:not-allowed}
button.on{background:#c62828;border-color:#c62828;color:#fff}
button.go{background:#1b8a4b;border-color:#1b8a4b;color:#fff}
button.no{background:#c62828;border-color:#c62828;color:#fff}
button.go.on,button.no.on{box-shadow:0 0 0 3px #f5b941}
button.big{padding:9px 14px;font-weight:700;font-size:13.5px}
input{font:inherit;color:var(--text);background:#fff;border:1px solid #dba3a3;border-radius:6px;padding:9px 12px;width:280px}
.wrap{max-width:1560px;margin:0 auto;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(160,30,30,.08)}
.mute{color:var(--mute)} .small{font-size:11.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.04em}
.CLEAR{background:#dff3e7;color:var(--ok)} .UNCLEAR{background:#fdeccc;color:var(--warn)} .BUSY{background:#dceafb;color:var(--info)}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)} .c-info{color:var(--info)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:14px}
.rolebtn{display:flex;justify-content:space-between;width:100%;margin-top:6px;text-align:left}
.rolelist{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;border-top:4px solid #c62828}
.top .sp{flex:1}
.stat{text-align:center;padding:0 10px}.stat b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:300px 1fr 330px;gap:12px;align-items:start}
@media(max-width:1150px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.call{border:1px solid var(--line);border-radius:8px;padding:9px;margin-top:8px;background:var(--panel2)}
.call.em{border:2px solid var(--bad);background:#ffe0e0;animation:blink 1s infinite}
@keyframes blink{50%{border-color:#ff9c9c}}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}
.main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.sensor{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(160,30,30,.08)}
.sensor.alarm{border:2px solid var(--bad);background:#fff3f3}
.sensor.flag{opacity:.6;border-style:dashed}
.sensor .hd{display:flex;align-items:center;gap:8px}
.sensor .ico{font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#ffe3e3;border-radius:8px;flex:none}
.sensor .nm{font-weight:700;font-size:12px;flex:1;min-width:0}
.sensor .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.sensor svg{display:block;width:100%;height:30px;margin:4px 0;background:#fff7f7;border:1px solid #f5d6d6;border-radius:4px}
.sensor.lg{padding:14px}
.sensor.lg .ico{font-size:30px;width:52px;height:52px;border-radius:12px}
.sensor.lg .nm{font-size:14.5px}
.sensor.lg .val{font-size:40px}
.sensor.lg svg{height:84px}
.sensor.lg .kv{font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute)}.kv b{color:var(--text);font-weight:700;text-align:right}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;background:#c62828;color:#fff;white-space:nowrap}
.log{max-height:260px;overflow:auto;font-size:12px}
.log div{padding:3px 0;border-bottom:1px solid #f6dede}
.logs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{padding:11px 14px;border-radius:8px;font-weight:700;margin-bottom:12px}
.banner.crit{background:#c62828;color:#fff;border:2px solid #7f1010;animation:blink 1s infinite}
.banner.wait{background:#fff;border:1px solid var(--line);border-left:6px solid #c62828}
.ops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:1100px){.ops{grid-template-columns:1fr}}
.strip{position:relative;height:118px;margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#cfe6fb 0%,#eef6fd 62%,#9cc29f 62%,#86b08a 100%)}
.rwy{position:absolute;left:3%;right:3%;top:74%;height:13%;background:#4a4f55;border-top:2px solid #fff;border-bottom:2px solid #fff}
.rwy:after{content:"";position:absolute;left:2%;right:2%;top:45%;border-top:2px dashed #fff}
.rwyno{position:absolute;left:3.5%;top:57%;font-weight:700;font-size:12px;color:#33413a}
.plane{position:absolute;width:64px;height:26px;margin:-22px 0 0 -32px;transition:left 1.2s linear,top 1.2s linear,opacity .6s;pointer-events:none}
.veh{position:absolute;top:70%;font-size:22px;transition:left 1.2s linear}
.boom{position:absolute;left:60%;top:60%;font-size:40px;margin:-22px 0 0 -20px;animation:boom .5s infinite alternate}
@keyframes boom{to{transform:scale(1.25)}}
.cap{position:absolute;right:8px;top:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.9);border:1px solid var(--line);padding:2px 8px;border-radius:5px}
.rdy{font-size:12.5px;margin-top:6px;padding:4px 8px;border-radius:6px;background:#eef6ee;color:#1b6b3c}
.rdy.none{background:#f6f1f1;color:var(--mute)}
.others{margin-top:10px;border-top:1px dashed var(--line);padding-top:7px;font-size:11.5px;color:var(--mute)}
.others span{display:inline-block;background:#f6f1f1;border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;color:var(--text)}
ul.b{margin:6px 0 0;padding-left:17px;font-size:12px;color:var(--mute)}ul.b li{margin:3px 0}ul.b b{color:var(--text)}
.op{border-top:5px solid #c62828;padding:12px 14px;min-height:120px}
.op.live{background:#fff8e1;border-color:#f5a623;box-shadow:0 0 0 2px #f5a623}
.op h2{font-size:17px}
.op .call{font-size:14px;padding:10px 12px;background:#fff}
.op .call b{font-size:17px}
.op button{font-size:14px;padding:9px 14px;font-weight:700}
.op .empty{font-size:15px;color:var(--mute);margin-top:10px}
.reg{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--mute)}
.reg b{color:var(--text)}
.reg input{flex:1;width:auto;min-width:60px;padding:0;accent-color:#c62828;height:22px;cursor:pointer;border:0;background:none}
.reg input:disabled{opacity:.4;cursor:not-allowed}
.help{font-size:11.5px;color:var(--mute)}.help b{color:var(--text)}.help div{margin-top:5px}
.sub{font-size:11.5px;font-weight:700;color:#a31919;text-transform:uppercase;letter-spacing:.05em;margin:2px 0 -4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#c62828;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div id="lobby" style="display:none">
    <h1>Airport Runway Digital Twin</h1>
    <p class="mute">Data quality and noise handling: join a runway control room, pick a role, and keep aircraft safe when the sensors cannot always be trusted.</p>
    <div class="panel"><label>Your name&nbsp; <input id="name" maxlength="24" placeholder="e.g. Aino"></label>
      <span class="mute small">&nbsp; Then click a free role in a room below. A new room opens when the open rooms are full.</span></div>
    <div class="rooms" id="rooms"></div>
    <h3 style="margin-top:20px">The six roles</h3>
    <div class="rolelist" id="rolelist"></div>
  </div>
  <div id="dash" style="display:none"></div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=b=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const mmss=t=>Math.floor(t/60)+':'+String(Math.max(0,Math.floor(t%60))).padStart(2,'0');
let token=null; try{token=localStorage.getItem('rwy_token')}catch(e){}
let lastSeq=null, audio=null, busy=false, dragging=false;

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3000)}
function beep(f,d,type,when){ if(!audio)return; const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+(when||0);
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}
function initAudio(){ if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} }
document.addEventListener('pointerdown',initAudio);

// ---------- lobby ----------
async function lobby(){
  const d=await api({op:'lobby'});
  $('dash').style.display='none'; $('lobby').style.display='block';
  $('rooms').innerHTML=d.rooms.map(r=>{
    const n=Object.keys(r.roles).length;
    return `<div class="panel"><h3>Runway ${r.n} Control Room <span class="mute small">${n}/6</span></h3>`+
      d.roles.map(ro=>r.roles[ro.id]?`<button class="rolebtn" disabled><span>${esc(ro.name)}</span><span>${esc(r.roles[ro.id])}</span></button>`
        :`<button class="rolebtn" data-reg="${r.n}|${ro.id}"><span>${esc(ro.name)}</span><span class="c-ok">free - join</span></button>`).join('')+`</div>`}).join('')
    +(d.rooms.length<d.maxRooms?`<div class="panel mute">Runway ${d.rooms.length+1} opens when all rooms above are full.</div>`:'');
  $('rolelist').innerHTML=d.roles.map(ro=>`<div class="panel small"><b>${esc(ro.name)}</b><br><span class="mute">${esc(ro.job)}</span></div>`).join('');
}
async function register(room,role){
  const name=$('name').value.trim(); if(!name){toast('Please type your name first.');$('name').focus();return}
  const d=await api({op:'register',name,room:+room,role});
  if(d.error){toast(d.error);lobby();return}
  token=d.token; try{localStorage.setItem('rwy_token',token)}catch(e){}
  poll();
}

// ---------- dashboard ----------
const ICON={cam:'📷',hum:'💧',st:'🌡️',fp:'❄️',tr:'🔭',fs:'🌫️',ws:'🌬️',smr:'📡'};
// sensors each position watches most closely (shown large in the middle)
const FOCUS={atc:['smr','tr','ws'],monitor:['cam','smr','fp'],analyst:['tr','fs','fp','cam'],maint:['st','fp','cam'],weather:['ws','hum','fs','tr'],comms:['tr','ws','smr']};
function spark(s,big){
  const W=240,H=big?84:30,span=(s.max-s.min)||1,y=v=>H-3-((Math.max(s.min,Math.min(s.max,v))-s.min)/span)*(H-6),n=s.hist.length;
  const line=(arr,col,w)=>{ let segs=[],cur=[];
    arr.forEach((v,i)=>{ if(v==null){if(cur.length)segs.push(cur);cur=[]} else cur.push((i/(Math.max(n-1,1))*W).toFixed(1)+','+y(v).toFixed(1)) });
    if(cur.length)segs.push(cur);
    return segs.map(p=>`<polyline points="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" vector-effect="non-scaling-stroke"/>`).join(''); };
  const off=n-s.raw.length, raw=s.hist.map((_,i)=>i-off>=0?s.raw[i-off]:null);
  const thr=s.thr!=null?`<line x1="0" x2="${W}" y1="${y(s.thr)}" y2="${y(s.thr)}" stroke="#c62828" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${thr}${s.smooth?line(raw,'#b9b3b5',1):''}${line(s.hist,'#1565c0',s.smooth?2.2:1.6)}</svg>`;
}
function sensorCard(s,d,big){
  const P=d.perms, val=s.cal?'<span class="c-info" style="font-size:15px">CALIBRATING…</span>':s.value==null?'<span class="c-warn" style="font-size:15px">NO DATA</span>':s.value.toFixed(s.dec)+` <span class="mute small">${esc(s.unit)}</span>`;
  return `<div class="sensor ${big?'lg':''} ${s.alarm&&!s.flagged?'alarm':''} ${s.flagged?'flag':''}">
    <div class="hd"><span class="ico">${ICON[s.id]}</span><span class="nm">${esc(s.name)}</span>${s.alarm?`<span class="badge">${esc(s.alarm)}</span>`:''}</div>
    <div class="val">${val}</div>${spark(s,big)}
    ${s.fields.map(f=>`<div class="kv"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}
    ${s.flagged?'<div class="small c-warn">Flagged faulty: excluded from assessment</div>':''}
    <label class="reg" title="Data Quality Analyst: noise smoothing filter"><b>Smoothing</b> off<input type="range" min="0" max="4" step="1" value="${s.smooth}" data-smooth="${s.id}" ${P.analyst?'':'disabled'}>full</label>
    ${s.smooth?`<div class="small" style="color:#1565c0">Filter ${s.smooth}/4 · blue = filtered, grey = raw · ${s.removed} false spike${s.removed===1?'':'s'} removed</div>`:''}
    <div class="row">
      <button data-act="xcheck" data-sensor="${s.id}" ${P.monitor&&!d.room.xc?'':'disabled'} title="Sensor Monitor">${d.room.xc===s.id?'Checking…':'Cross-check'}</button>
      <button class="${s.flagged?'on':''}" data-act="flag" data-sensor="${s.id}" data-on="${s.flagged?0:1}" ${P.analyst?'':'disabled'} title="Data Quality Analyst">${s.flagged?'Un-flag':'Flag faulty'}</button>
      <button data-act="recal" data-sensor="${s.id}" ${P.maint&&!s.cal?'':'disabled'} title="Maintenance Engineer">Recalibrate</button>
    </div></div>`;
}
const planeSvg=(body,wing)=>`<svg viewBox="0 0 64 26"><path d="M3 15 L10 3 L15 3 L16 12 L47 11 Q60 11 62 16 Q60 20 48 20 L12 20 Q4 20 3 15Z" fill="${body}" stroke="#222" stroke-width="1"/><path d="M26 16 L40 16 L30 24 L24 24Z" fill="${wing}" stroke="#222" stroke-width="1"/><rect x="50" y="13" width="6" height="2.5" rx="1" fill="#ffffff"/></svg>`;
const PLANE_L=planeSvg('#1565c0','#0d3c78'), PLANE_T=planeSvg('#c62828','#8e1b1b'); // blue = arriving, red = departing
function planeFor(r,kind,prevKey){ // position of the arriving (landing) or departing (takeoff) aircraft, in % of the strip
  const a=r.assigned, o=r.lastOp;
  if(a&&a.kind===kind){ const p=Math.min(1,a.p), key=a.cs+'|'+(a.emergency?'e':'n');
    if(kind==='landing') return {key,x:2+p*56,y:10+p*64,rot:7,op:1};
    if(p<.55) return {key,x:8,y:74,rot:0,op:1};
    const q=(p-.55)/.45; return {key,x:8+q*q*46,y:74,rot:0,op:1}; }
  if(o&&o.kind===kind&&o.age<8&&o.outcome!=='crash'){ const q=o.age/7, key=prevKey&&prevKey.indexOf(o.cs+'|')===0?prevKey:o.cs+'|';
    if(o.outcome==='success'&&kind==='landing') return {key,x:58+Math.min(1,q)*34,y:74,rot:0,op:q>1?0:1};
    if(o.outcome==='success') return {key,x:54+q*50,y:74-q*70,rot:-14,op:q>1?0:1};
    if(kind==='takeoff') return {key,x:8,y:74,rot:0,op:q>.8?0:1};
    const p=o.p||0, x0=2+p*56, y0=10+p*64; return {key,x:x0+q*(104-x0),y:y0-q*(y0+12),rot:-14,op:q>1?0:1}; }
  return null;
}
function movePlane(el,r,kind){
  const ps=planeFor(r,kind,el.dataset.k||'');
  if(!ps){ el.style.opacity=0; el.dataset.k=''; return; }
  if(el.dataset.k!==ps.key){ // a different aircraft: place it at its start point instantly instead of sliding across
    el.style.transition='none'; el.style.opacity=0; el.style.left=ps.x+'%'; el.style.top=ps.y+'%'; el.offsetWidth; el.style.transition=''; el.dataset.k=ps.key; }
  el.style.left=ps.x+'%'; el.style.top=ps.y+'%'; el.style.transform='rotate('+ps.rot+'deg)'; el.style.opacity=ps.op;
}
const JOB={
  atc:['Answer every aircraft call within 60 s','Press <b>ACCEPT flight</b> or <b>Decline</b>: first runway to accept gets it','You own the final go / no-go'],
  monitor:['Watch all sensor trends','<b>Cross-check</b> any suspicious sensor','Tell the team: real hazard or faulty sensor'],
  analyst:['Slide <b>Smoothing</b> up to remove spikes','<b>Flag</b> a sensor only when proven faulty','Un-flag it after it is repaired'],
  maint:['<b>Recalibrate</b> faulty sensors','Send crews to fix real runway problems','Crews block the runway while they work'],
  weather:['Request a <b>manual observation</b>','Confirm fog, wind, rain or snow','Tell the team when weather will change'],
  comms:['Ask the pilot for a <b>report</b>','Transmit <b>GO-AROUND</b> if the runway turns unsafe','Abort only for a real hazard'] };
const SKEL=`<div id="dTop"></div><div class="ops"><div class="panel op" id="opCalls"></div><div class="panel op" id="opRwy"></div>
  <div class="panel op" id="opView"><h2>🛫 Runway <span id="rwN"></span> live view</h2><div class="strip"><div class="rwy"></div><div class="rwyno" id="rwNo"></div>
    <div class="plane" id="plL" style="opacity:0;left:2%;top:10%">${PLANE_L}</div><div class="plane" id="plT" style="opacity:0;left:8%;top:74%">${PLANE_T}</div><div class="veh" id="vh" style="display:none">🚜</div><div class="boom" id="bm" style="display:none">💥</div><div class="cap" id="cp" style="display:none"></div></div></div></div><div id="dGrid"></div>`;
let voiceOn=true; try{voiceOn=localStorage.getItem('rwy_voice')!=='off'}catch(e){}
function speak(text){ // tower voice through the browser's built-in speech engine
  if(!voiceOn||!window.speechSynthesis) return;
  if(speechSynthesis.pending) speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text), v=speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));
  if(v) u.voice=v; u.lang='en-GB'; u.rate=1.02; u.pitch=.85; setTimeout(()=>speechSynthesis.speak(u),500);
}
function drawStrip(d){
  const r=d.room;
  $('rwN').textContent=r.n; $('rwNo').textContent=String(r.n).padStart(2,'0');
  movePlane($('plL'),r,'landing'); movePlane($('plT'),r,'takeoff');
  const o=r.lastOp, a=r.assigned;
  $('bm').style.display=(r.wreck||(o&&o.outcome==='crash'&&o.age<6))?'block':'none';
  $('vh').style.display=r.job?'block':'none'; if(r.job) $('vh').style.left=(20+((d.t*7)%60))+'%';
  const cap=a?(a.emergency?'MAYDAY ':'')+a.cs+(a.kind==='landing'?' landing in ':' take-off in ')+Math.max(0,a.left)+' s'
    :o&&o.age<10?o.cs+': '+({success:o.kind==='landing'?'landed safely':'departed safely',crash:'ACCIDENT',goaround:o.kind==='landing'?'GO-AROUND':'take-off aborted'})[o.outcome]
    :r.job?r.job.label+' · '+r.job.left+' s':r.wreck?'Wreck removal · '+r.wreck+' s':'';
  $('cp').textContent=cap; $('cp').style.display=cap?'block':'none';
}
function render(d){
  $('lobby').style.display='none'; const el=$('dash'); el.style.display='block';
  if(!$('dTop')) el.innerHTML=SKEL;
  const r=d.room, P=d.perms, me=d.roles.find(x=>x.id===d.me.role), a=r.assigned;
  const crit=a&&r.auto.filter(h=>h!=='RUNWAY WORK').length;
  const focus=FOCUS[d.me.role]||[], big=r.sensors.filter(s=>focus.includes(s.id)).sort((x,y)=>focus.indexOf(x.id)-focus.indexOf(y.id)), small=r.sensors.filter(s=>!focus.includes(s.id));
  let h=`<div class="top panel">
    <div><h2>Runway ${r.n} Control Room</h2><span class="mute">${esc(d.me.name)} · <b style="color:var(--text)">${esc(me.name)}</b></span></div>
    <span class="pill ${r.status}">${r.status}</span><div class="sp"></div>
    <div class="stat"><span class="mute small">Time left</span><b>${mmss(d.left)}</b></div>
    <div class="stat"><span class="mute small">Score</span><b>${r.score}</b></div>
    <div class="stat"><span class="mute small">Safe ops</span><b class="c-ok">${r.stats.success}</b></div>
    <div class="stat"><span class="mute small">Accidents</span><b class="c-bad">${r.stats.crash}</b></div>
    <div class="stat"><span class="mute small">Go-arounds</span><b class="c-warn">${r.stats.goRight+r.stats.goWrong}</b></div>
    <button data-voice="1" class="small">🔊 Voice: ${voiceOn?'on':'off'}</button>
    <button data-leave="1" class="small">Leave</button></div>`;
  if(d.status==='lobby') h+=`<div class="banner wait">Waiting for the presenter to press Start on the admin screen. No aircraft will appear until then. Study your sensors: the first aircraft calls 30 seconds after the start.</div>`;
  if(d.status==='paused') h+=`<div class="banner wait">Simulation paused.</div>`;
  if(d.status==='ended') h+=`<div class="banner wait">Session complete. Final score ${r.score}. Your sensor picture matched reality ${d.debrief.dq}% of the time. ${d.debrief.faults} sensor faults were injected into your room; your team repaired ${d.debrief.fixed} of them by recalibration.</div>`;
  if(crit) h+=`<div class="banner crit">⚠️ CRITICAL WARNING while ${esc(a.cs)} is ${a.kind==='landing'?'on final approach':'lining up'}: ${esc(r.auto.join(', '))}. Real hazard or sensor noise? Decide now.</div>`;
  $('dTop').innerHTML=h;
  // --- top box 1: aircraft calling
  h=`<h2>✈️ Aircraft calling</h2>`;
  if(!d.calls.length) h+=`<div class="empty">No aircraft calling right now.</div>`;
  for(const c of d.calls){
    h+=`<div class="call ${c.emergency?'em':''}"><b>${c.emergency?'MAYDAY · ':''}${esc(c.cs)}</b> · ${c.emergency?'needs an emergency landing NOW':c.kind==='landing'?'inbound for landing, 2 minutes out':'requests take-off within 2 minutes'}
      · answer within <b>${Math.max(0,c.left)} s</b>`;
    if(c.excluded) h+=`<div class="small mute">Went around from your runway: other rooms must take it.</div>`;
    else h+=`<div class="row"><button class="go" data-act="respond" data-ac="${c.id}" data-ans="accept" ${P.atc?'':'disabled'} title="ATC Controller">${c.emergency?'ACCEPT NOW':'ACCEPT flight'}</button>
      <button class="no ${c.resp==='decline'?'on':''}" data-act="respond" data-ac="${c.id}" data-ans="decline" ${P.atc&&!c.emergency?'':'disabled'} title="ATC Controller">Decline</button>
      ${c.resp?`<span class="c-warn">you answered: <b>DECLINE</b></span>`:'<span class="mute small">(ATC Controller)</span>'}</div>`;
    h+=`<div class="rdy none">${c.emergency?'First runway to accept gets this emergency.':'First runway to accept gets the flight.'}${c.declined.length?' Declined by: '+c.declined.map(n=>n===r.n?'<b>Runway '+n+' (you)</b>':'Runway '+n).join(', ')+'.':''}</div>`;
    h+=`</div>`;
  }
  $('opCalls').innerHTML=h; $('opCalls').className='panel op '+(d.calls.some(c=>!c.excluded)?'live':'');
  // --- top box 2: on your runway
  h=`<h2>🛬 On your runway</h2>`;
  if(a) h+=`<div class="call"><b>${a.emergency?'MAYDAY · ':''}${esc(a.cs)}</b> · ${a.kind==='landing'?'APPROACHING - touchdown':'lining up - take-off'} in <b>${Math.max(0,a.left)} s</b>
      <div class="row"><button class="no" data-act="abort" ${P.comms?'':'disabled'} title="Communicator">${a.kind==='landing'?'Transmit GO-AROUND':'ABORT TAKE-OFF'}</button>
      <button data-act="pirep" ${P.comms?'':'disabled'} title="Communicator">Ask pilot report</button></div></div>`;
  else if(!r.job&&!r.wreck) h+=`<div class="empty">No aircraft assigned.</div>`;
  if(r.job) h+=`<div class="call"><span class="c-warn">Crew on runway:</span> ${esc(r.job.label)} · ${r.job.left} s left</div>`;
  if(r.wreck) h+=`<div class="call"><span class="c-bad">Wreckage on runway</span> · cleared in ${r.wreck} s</div>`;
  if(d.traffic.length) h+=`<div class="others">Other runways: ${d.traffic.map(x=>`<span>${x.emergency?'MAYDAY ':''}<b>${esc(x.cs)}</b> · Runway ${x.room} · ${x.kind==='landing'?'landing':'take-off'} in ${Math.max(0,x.left)} s</span>`).join('')}</div>`;
  $('opRwy').innerHTML=h; $('opRwy').className='panel op '+(a?'live':'');
  // --- top box 3: live runway view (updated in place so the aircraft moves smoothly)
  drawStrip(d);
  // --- main grid
  const W={}; for(const w of r.work) W[w.id]=w.d;
  h=`<div class="grid"><div class="col">
    <div class="panel"><h3>Your job: ${esc(me.name)}</h3><ul class="b">${(JOB[d.me.role]||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="small mute" style="margin-top:6px">Team: ${d.team.map(m=>esc(m.name)+' ('+esc(d.roles.find(x=>x.id===m.role).name)+')').join(', ')}. Empty roles: anyone may use their controls.</div></div>
    <div class="panel"><h3>🚜 Runway crews <span class="mute small">(Maintenance)</span></h3><div class="row">
      ${r.work.map(w=>`<button data-act="work" data-work="${w.id}" ${P.maint&&!r.job?'':'disabled'}>${esc(w.label)} <span class="small">${w.d}s</span></button>`).join('')}</div></div>
    <div class="panel"><h3>👁️ Weather observer <span class="mute small">(Weather Officer)</span></h3><div class="row">
      <button data-act="observe" ${P.weather&&r.obsWait===0?'':'disabled'}>${r.obsWait===-1?'Observing…':r.obsWait>0?'Available in '+r.obsWait+' s':'Request manual observation'}</button></div></div>
    <div class="panel"><h3>If the alarm is real</h3><ul class="b">
      <li><b>Obstruction</b> → Debris sweep (${W.sweep} s)</li><li><b>Ice</b> → De-icing (${W.deice} s)</li>
      <li><b>Snow</b> → Snow ploughing (${W.plow} s). Needed when the camera shows "WHITE - snow cover"; a gauge reading "snow" and a surface temperature below 0 °C confirm it</li>
      <li><b>Lighting failure</b> → Lighting repair (${W.lights} s). Never a false alarm</li><li><b>Wreckage</b> → clears by itself in 20 s</li>
      <li><b>Low visibility, crosswind</b> → wait, weather passes</li><li><b>Faulty sensor</b> → Recalibrate (5 s)</li></ul></div>
    <div class="panel"><h3>Sensor controls</h3><ul class="b">
      <li><b>Cross-check</b>: test against a reference, 8 s</li><li><b>Smoothing</b>: removes spikes and jitter; reading reacts slower</li>
      <li><b>Flag faulty</b>: hides the sensor from the assessment</li><li><b>Recalibrate</b>: repairs the sensor, 5 s</li></ul></div>
    <div class="panel"><h3>Points</h3><ul class="b">
      <li>Safe landing or take-off: <b>+10</b></li><li>Safe emergency landing: <b>+20</b></li><li>Correct abort: <b>+10</b></li>
      <li>Wrong abort: <b>-5</b></li><li>Declined or ignored while safe: <b>-5</b></li><li>Accident: <b>-20</b></li></ul></div>
  </div>
  <div class="col">
    <div class="panel"><div class="kv" style="font-size:13.5px"><b style="text-align:left">Automatic runway assessment (from sensors as filtered by your team)</b>
      <span class="pill ${r.auto.length?'UNCLEAR':'CLEAR'}">${r.auto.length?'UNCLEAR':'CLEAR'}</span></div>
      <div style="margin-top:6px">${r.auto.length?r.auto.map(x=>`<span class="badge">${esc(x)}</span>`).join(' '):'<span class="mute small">No hazard reported by the sensors.</span>'}
      <span class="small mute">&nbsp; Runway lighting: <b class="${r.lights?'c-ok':'c-bad'}">${r.lights?'OK':'FAILED'}</b></span></div></div>
    <div class="sub">Your key sensors as ${esc(me.name)}</div>
    <div class="main">${big.map(s=>sensorCard(s,d,true)).join('')}</div>
    <div class="logs">
      <div class="panel"><h3>Room log</h3><div class="log">${r.log.slice().reverse().map(l=>`<div class="c-${l.c}"><span class="mute">${l.t}</span> ${esc(l.m)}</div>`).join('')||'<div class="mute">Nothing yet.</div>'}</div></div>
      <div class="panel"><h3>Tower radio</h3><div class="log">${d.radio.slice().reverse().map(l=>`<div class="c-${l.c}"><span class="mute">${l.t}</span> ${esc(l.m)}</div>`).join('')||'<div class="mute">Silence.</div>'}</div></div>
    </div>
  </div>
  <div class="col"><div class="sub">Other sensors</div>${small.map(s=>sensorCard(s,d,false)).join('')}</div></div>`;
  const logs=[...el.querySelectorAll('.log')].map(x=>x.scrollTop);
  $('dGrid').innerHTML=h;
  [...el.querySelectorAll('.log')].forEach((x,i)=>x.scrollTop=logs[i]||0);
  // sounds and tower voice
  if(lastSeq!==null) for(const e of d.events) if(e.seq>lastSeq){
    if(e.type==='call'){beep(880,.15);beep(1175,.2,'sine',.16)}
    if(e.type==='mayday'){for(let i=0;i<3;i++){beep(700,.18,'square',i*.4);beep(500,.18,'square',i*.4+.2)}}
    if(e.room===r.n&&e.type==='crash') beep(90,.9,'sawtooth');
    if(e.room===r.n&&(e.type==='land'||e.type==='takeoff')){beep(660,.12);beep(990,.25,'sine',.13)}
    if(e.say&&(!e.room||e.room===r.n)) speak(e.say);
  }
  lastSeq=d.evSeq;
}
async function poll(){
  if(!token) return lobby();
  if(busy) return; busy=true;
  try{ const d=await api({op:'state',token}); handle(d) }catch(e){} busy=false;
}
function handle(d){
  if(d.error==='not-registered'){token=null;try{localStorage.removeItem('rwy_token')}catch(e){};lastSeq=null;lobby();return}
  if(d.error){toast(d.error);return}
  if(dragging) return; // do not redraw while a smoothing slider is being moved
  render(d);
}
document.addEventListener('pointerdown',async ev=>{
  const b=ev.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.reg){const [room,role]=b.dataset.reg.split('|');register(room,role);return}
  if(b.dataset.voice){ voiceOn=!voiceOn; try{localStorage.setItem('rwy_voice',voiceOn?'on':'off')}catch(e){}; if(voiceOn) speak('Tower voice is on.'); else if(window.speechSynthesis) speechSynthesis.cancel(); b.textContent='🔊 Voice: '+(voiceOn?'on':'off'); return}
  if(b.dataset.leave){ if(confirm('Leave this control room and free your role?')){await api({op:'leave',token});token=null;try{localStorage.removeItem('rwy_token')}catch(e){};lobby()} return}
  if(b.dataset.act){
    const q={op:'act',token,type:b.dataset.act};
    for(const k of ['sensor','work','ans']) if(b.dataset[k]) q[k]=b.dataset[k];
    if(b.dataset.ac) q.ac=+b.dataset.ac; if(b.dataset.on!==undefined) q.on=b.dataset.on==='1';
    try{handle(await api(q))}catch(e){toast('Connection problem.')}
  }
});
document.addEventListener('pointerdown',ev=>{ if(ev.target.matches&&ev.target.matches('input[type=range]')) dragging=true },true);
document.addEventListener('change',async ev=>{ const t=ev.target; if(!t.dataset||!t.dataset.smooth) return;
  dragging=false; try{handle(await api({op:'act',token,type:'smooth',sensor:t.dataset.smooth,level:+t.value}))}catch(e){toast('Connection problem.')} });
window.addEventListener('pointerup',()=>setTimeout(()=>{dragging=false},400));
window.addEventListener('pointercancel',()=>{dragging=false});
poll(); setInterval(poll,1200);
</script>
</body>
</html>
