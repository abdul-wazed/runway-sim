<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Simulation - Admin Overview</title>
<style>
:root{--bg:#0b1118;--panel:#131c26;--panel2:#1a2532;--line:#2a3848;--text:#dfe7ef;--mute:#8fa0b3;--ok:#3ecf8e;--warn:#f5b941;--bad:#ff5d5d;--info:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--info)} button.on{background:#1d4d80;border-color:var(--info)} button.go{background:#17603f;border-color:var(--ok)}
input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.wrap{padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.top .sp{flex:1}
.clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 12px}
.mute{color:var(--mute)} .small{font-size:12.5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card.EMPTY{opacity:.45}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head .sp{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.04em}
.CLEAR{background:#14452f;color:var(--ok)} .UNCLEAR{background:#55401a;color:var(--warn)} .BUSY{background:#1d3a5c;color:var(--info)} .EMPTY .pill,.pill.EMPTY{background:#222c38;color:var(--mute)}
.card h2{font-size:18px}.num{font-size:13px;white-space:nowrap}.num b{font-size:18px} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)} .c-info{color:var(--info)}
.badge{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:#5a2323;color:#ffb3b3;margin-right:4px}
.badge.t{background:#3b2a5c;color:#d5c2ff}
.strip{position:relative;height:120px;margin-top:8px;border-radius:8px;overflow:hidden;background:linear-gradient(#17304d 0%,#274766 62%,#2f4a34 62%,#263c2b 100%)}
.rwy{position:absolute;left:3%;right:3%;top:74%;height:13%;background:#3b4046;border-top:2px solid #cfd4da;border-bottom:2px solid #cfd4da}
.rwy:after{content:"";position:absolute;left:2%;right:2%;top:45%;border-top:2px dashed #e8eaed}
.rwyno{position:absolute;left:3.5%;top:58%;font-weight:700;font-size:13px;color:#fff;opacity:.85}
.plane{position:absolute;width:64px;height:26px;margin:-22px 0 0 -32px;transition:left 1s linear,top 1s linear,opacity .6s;pointer-events:none}
.veh{position:absolute;top:70%;font-size:22px;transition:left 1s linear}
.boom{position:absolute;left:60%;top:60%;font-size:40px;margin:-22px 0 0 -20px;animation:boom .5s infinite alternate}
@keyframes boom{to{transform:scale(1.25)}}
.cap{position:absolute;right:8px;top:6px;font-size:12.5px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:5px}
.cap.l{right:auto;left:8px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.log div{padding:2px 0;border-bottom:1px solid #1e2a37;font-size:13.5px}
table{border-collapse:collapse;width:100%}td,th{padding:3px 8px;text-align:left;border-bottom:1px solid #1e2a37}th{color:var(--mute);font-weight:500;font-size:12.5px}
#login{max-width:420px;margin:15vh auto;text-align:center}
</style>
</head>
<body>
<div id="login" style="display:none" class="card"><h2>Admin overview</h2><p class="mute">Enter the admin key to control the simulation.</p>
  <input id="key" type="password" placeholder="admin key"> <button id="enter" class="go">Enter</button><p id="err" class="c-bad"></p></div>
<div class="wrap" id="main" style="display:none">
  <div class="top">
    <h1>Airport Runway Digital Twin <span class="mute" style="font-size:15px">· data quality and noise</span></h1><div class="sp"></div>
    <span id="status" class="pill BUSY"></span><span class="clock" id="clock"></span>
    <button id="bStart" class="go">Start</button><button id="bPause">Pause</button>
    <button id="bReveal" title="Show the real runway condition and active sensor faults">Reveal truth</button>
    <button id="bSound">Sound: on</button>
    <button id="bReset" title="Clears game outcomes, keeps registrations">Reset game</button>
    <button id="bWipe" title="Also removes all registrations">Clear registrations</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="bottom"><div class="card"><h3>Tower radio</h3><div class="log" id="radio"></div></div>
    <div class="card"><h3>Leaderboard</h3><div id="board"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=t=>Math.floor(t/60)+':'+String(Math.max(0,Math.floor(t%60))).padStart(2,'0');
let key=''; try{key=sessionStorage.getItem('rwy_admin')||''}catch(e){}
let reveal=false, sound=true, lastSeq=null, audio=null, busy=false, built='';
const PLANE=`<svg viewBox="0 0 64 26"><path d="M3 15 L10 3 L15 3 L16 12 L47 11 Q60 11 62 16 Q60 20 48 20 L12 20 Q4 20 3 15Z" fill="#f2f5f8" stroke="#0b1118" stroke-width="1"/><path d="M26 16 L40 16 L30 24 L24 24Z" fill="#b9c3cf" stroke="#0b1118" stroke-width="1"/><rect x="50" y="13" width="6" height="2.5" rx="1" fill="#2b6cb0"/></svg>`;

// ---------- sound (synthesised, no files) ----------
function ctx(){ if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(audio&&audio.state==='suspended')audio.resume(); return audio }
document.addEventListener('pointerdown',ctx);
function noise(dur,f0,f1,vol,type){ const a=ctx(); if(!a||!sound)return; const n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1; const src=a.createBufferSource(),flt=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;
  src.buffer=buf;flt.type=type||'bandpass';flt.Q.value=.8;flt.frequency.setValueAtTime(f0,t);flt.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.25);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(flt).connect(g).connect(a.destination);src.start(t) }
function tone(f,d,type,when,vol,f2){ const a=ctx(); if(!a||!sound)return; const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d) }
const SND={
  land(){noise(3,1800,300,.35);tone(1400,.12,'sawtooth',1.2,.08);tone(1300,.12,'sawtooth',1.45,.08)},
  takeoff(){noise(3.5,300,2200,.4)},
  crash(){noise(2.2,900,60,.9,'lowpass');tone(110,1.4,'sawtooth',0,.4,30)},
  goaround(){noise(2.5,500,2400,.35);tone(900,.15,'square',0,.07);tone(900,.15,'square',.25,.07)},
  work(){for(let i=0;i<4;i++)tone(1000,.16,'square',i*.42,.07)},
  workdone(){tone(660,.12,'sine',0,.12);tone(880,.22,'sine',.14,.12)},
  call(){tone(880,.15,'sine',0,.12);tone(1175,.25,'sine',.17,.12)},
  mayday(){for(let i=0;i<3;i++){tone(720,.2,'square',i*.44,.1);tone(520,.2,'square',i*.44+.22,.1)}},
};

async function call(cmd){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'admin',key,cmd})});
  return r.json();
}
function planeState(r){ // -> {x,y,rot,op} in % of the strip
  const a=r.assigned, o=r.lastOp;
  if(a){ const p=Math.min(1,a.p);
    if(a.kind==='landing') return {x:2+p*56,y:10+p*64,rot:7,op:1};
    if(p<.55) return {x:8,y:74,rot:0,op:1};
    const q=(p-.55)/.45; return {x:8+q*q*46,y:74,rot:0,op:1}; }
  if(o&&o.age<8){ const q=o.age/7;
    if(o.outcome==='success'&&o.kind==='landing') return {x:58+Math.min(1,q)*34,y:74,rot:0,op:q>1?0:1};
    if(o.outcome==='success') return {x:54+q*50,y:74-q*70,rot:-14,op:q>1?0:1};
    if(o.outcome==='goaround'){ const p=o.p||0;
      if(o.kind==='takeoff') return {x:8,y:74,rot:0,op:q>.8?0:1};
      const x0=2+p*56,y0=10+p*64; return {x:x0+q*(104-x0),y:y0-q*(y0+12),rot:-14,op:q>1?0:1}; } }
  return null;
}
function build(d){ // create cards once per room set; then update in place so animations stay smooth
  const sig=d.rooms.map(r=>r.n).join(',');
  if(sig===built) return; built=sig;
  $('cards').innerHTML=d.rooms.map(r=>`<div class="card" id="c${r.n}">
    <div class="head"><h2>Runway ${r.n} Control Room</h2><span class="pill" id="st${r.n}"></span><span class="mute small" id="tm${r.n}"></span><span class="sp"></span>
      <span class="num">Score <b id="sc${r.n}">0</b></span><span class="num c-ok">Safe <b id="ok${r.n}">0</b></span>
      <span class="num c-bad">Unsuccessful <b id="cr${r.n}">0</b></span><span class="num c-warn">Go-arounds <b id="ga${r.n}">0</b></span></div>
    <div class="small" id="pb${r.n}" style="min-height:20px;margin-top:4px"></div>
    <div class="strip"><div class="rwy"></div><div class="rwyno">${String(r.n).padStart(2,'0')}</div>
      <div class="plane" id="pl${r.n}" style="opacity:0;left:2%;top:10%">${PLANE}</div>
      <div class="veh" id="vh${r.n}" style="display:none">🚜</div><div class="boom" id="bm${r.n}" style="display:none">💥</div>
      <div class="cap" id="cp${r.n}"></div><div class="cap l" id="cl${r.n}" style="display:none"></div></div></div>`).join('');
}
function render(d){
  $('status').textContent=d.status.toUpperCase(); $('status').className='pill '+({running:'CLEAR',paused:'UNCLEAR',ended:'UNCLEAR',lobby:'BUSY'})[d.status];
  $('clock').textContent=mmss(d.left);
  $('bStart').textContent=d.status==='paused'?'Resume':'Start';
  build(d);
  for(const r of d.rooms){
    const n=r.n; $('c'+n).className='card '+(r.status==='EMPTY'?'EMPTY':'');
    $('st'+n).textContent=r.status; $('st'+n).className='pill '+r.status;
    $('tm'+n).textContent=r.team+'/6 in room';
    $('sc'+n).textContent=r.score; $('ok'+n).textContent=r.stats.success; $('cr'+n).textContent=r.stats.crash; $('ga'+n).textContent=r.stats.goRight+r.stats.goWrong;
    let pb=r.status==='EMPTY'?'<span class="mute">No team registered.</span>':r.problems.length?'Sensors report: '+r.problems.map(p=>`<span class="badge">${esc(p)}</span>`).join(''):'<span class="mute">Sensors report no problem.</span>';
    if(r.job) pb+=` <span class="c-warn">${esc(r.job.label)} · ${r.job.left}s</span>`;
    if(r.wreck) pb+=` <span class="c-bad">Wreck removal · ${r.wreck}s</span>`;
    if((reveal||d.status==='ended')&&r.status!=='EMPTY') pb+=`<br><span class="mute">Reality (${esc(r.wx)}):</span> `+(r.truth.length?r.truth.map(p=>`<span class="badge t">${esc(p)}</span>`).join(''):'<span class="c-ok">runway safe</span>')
      +(r.faults.length?` <span class="mute">· faulty sensors:</span> `+r.faults.map(esc).join('; '):'')+(r.dq!=null?` <span class="mute">· sensor picture correct ${r.dq}% of the time</span>`:'');
    $('pb'+n).innerHTML=pb;
    const ps=planeState(r), pl=$('pl'+n);
    if(ps){ if(pl.style.opacity==='0'&&ps.op){ pl.style.transition='none'; pl.style.left=ps.x+'%'; pl.style.top=ps.y+'%'; pl.offsetWidth; pl.style.transition=''; }
      pl.style.left=ps.x+'%'; pl.style.top=ps.y+'%'; pl.style.transform='rotate('+ps.rot+'deg)'; pl.style.opacity=ps.op; }
    else pl.style.opacity=0;
    $('bm'+n).style.display=(r.wreck||(r.lastOp&&r.lastOp.outcome==='crash'&&r.lastOp.age<6))?'block':'none';
    const vh=$('vh'+n); vh.style.display=r.job?'block':'none'; if(r.job) vh.style.left=(20+((d.t*7)%60))+'%';
    const a=r.assigned, o=r.lastOp;
    $('cp'+n).textContent=a?(a.emergency?'MAYDAY ':'')+a.cs+(a.kind==='landing'?' landing in ':' take-off in ')+Math.max(0,a.left)+' s'
      :o&&o.age<10?o.cs+': '+({success:o.kind==='landing'?'landed safely':'departed safely',crash:'ACCIDENT',goaround:o.kind==='landing'?'GO-AROUND':'take-off aborted'})[o.outcome]:'';
    $('cp'+n).style.display=$('cp'+n).textContent?'block':'none';
  }
  $('radio').innerHTML=d.radio.slice().reverse().map(l=>`<div class="c-${l.c}"><span class="mute">${l.t}</span> ${esc(l.m)}</div>`).join('')||'<div class="mute">'+d.participants+' participants registered. Press Start when the rooms are ready.</div>';
  const rows=d.rooms.filter(r=>r.team).sort((a,b)=>b.score-a.score);
  $('board').innerHTML=`<table><tr><th>#</th><th>Room</th><th>Score</th><th>Safe</th><th>Accidents</th><th>Correct aborts</th><th>Wrong aborts</th><th>Wrong declines</th>${d.status==='ended'||reveal?'<th>Data picture correct</th>':''}</tr>`+
    rows.map((r,i)=>`<tr><td>${i+1}</td><td>Runway ${r.n}</td><td><b>${r.score}</b></td><td>${r.stats.success}</td><td>${r.stats.crash}</td><td>${r.stats.goRight}</td><td>${r.stats.goWrong}</td><td>${r.stats.declWrong}</td>${d.status==='ended'||reveal?`<td>${r.dq==null?'-':r.dq+'%'}</td>`:''}</tr>`).join('')+'</table>';
  if(lastSeq!==null) for(const e of d.events) if(e.seq>lastSeq&&SND[e.type]) SND[e.type]();
  lastSeq=d.evSeq;
}
async function tick(cmd){
  if(busy&&!cmd) return; busy=true;
  try{ const d=await call(cmd);
    if(d.error==='bad-key'){ $('main').style.display='none'; $('login').style.display='block'; if(key)$('err').textContent='Wrong key.'; key=''; }
    else if(!d.error){ $('login').style.display='none'; $('main').style.display='block'; try{sessionStorage.setItem('rwy_admin',key)}catch(e){} render(d); }
  }catch(e){} busy=false;
}
$('enter').onclick=()=>{key=$('key').value;tick()}; $('key').onkeydown=e=>{if(e.key==='Enter')$('enter').onclick()};
$('bStart').onclick=()=>tick('start'); $('bPause').onclick=()=>tick('pause');
$('bReset').onclick=()=>{if(confirm('Reset the game? Scores and outcomes are cleared; registrations are kept.')){lastSeq=null;tick('reset')}};
$('bWipe').onclick=()=>{if(confirm('Remove ALL registrations and reset everything?')){lastSeq=null;built='';tick('wipe')}};
$('bReveal').onclick=()=>{reveal=!reveal;$('bReveal').className=reveal?'on':'';};
$('bSound').onclick=()=>{sound=!sound;$('bSound').textContent='Sound: '+(sound?'on':'off')};
tick(); setInterval(()=>{ if(key) tick() },1000);
</script>
</body>
</html>
